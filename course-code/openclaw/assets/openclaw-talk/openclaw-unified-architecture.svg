<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw and Pi unified architecture</title>
  <desc id="desc">A source-grounded diagram showing channels and clients entering the OpenClaw Gateway, prompt assembly feeding the Pi runtime, and events returning to the original surface.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#132238" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#36536f"/>
    </marker>
    <marker id="arrowLight" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#71869a"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #132238; }
      .subtitle { font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #60758a; }
      .section { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing: 1.2px; fill: #36536f; }
      .boxTitle { font: 700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #132238; }
      .boxText { font: 400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #496175; }
      .small { font: 600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #60758a; }
      .panel { stroke-width: 1.5; }
      .flow { fill: none; stroke: #36536f; stroke-width: 3; marker-end: url(#arrow); }
      .softFlow { fill: none; stroke: #71869a; stroke-width: 2.2; marker-end: url(#arrowLight); }
    </style>
  </defs>

  <rect width="1500" height="860" fill="#f7fafc"/>
  <rect x="28" y="24" width="1444" height="812" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="70" y="76" class="title">OpenClaw + Pi: from request to response</text>
  <text x="70" y="104" class="subtitle">OpenClaw supplies the long-running control plane and runtime context; Pi supplies the model/tool loop.</text>

  <!-- inbound surfaces -->
  <text x="70" y="153" class="section">REAL-WORLD SURFACES</text>
  <rect x="70" y="176" width="190" height="74" rx="12" fill="#e8f3f7" stroke="#8bc3d0" class="panel"/>
  <text x="92" y="207" class="boxTitle">Channels</text>
  <text x="92" y="229" class="boxText">Telegram · Discord · WebChat</text>
  <rect x="70" y="268" width="190" height="74" rx="12" fill="#e9eefb" stroke="#9aaee4" class="panel"/>
  <text x="92" y="299" class="boxTitle">Clients</text>
  <text x="92" y="321" class="boxText">CLI · Web UI · node</text>
  <rect x="70" y="360" width="190" height="74" rx="12" fill="#f5efe4" stroke="#d9bd89" class="panel"/>
  <text x="92" y="391" class="boxTitle">Internal triggers</text>
  <text x="92" y="413" class="boxText">cron · heartbeat · jobs</text>

  <!-- gateway -->
  <rect x="318" y="142" width="300" height="338" rx="18" fill="#eef5ff" stroke="#7698cf" class="panel"/>
  <text x="344" y="178" class="section">OPENCLAW GATEWAY</text>
  <text x="344" y="207" class="boxTitle">Long-running control plane</text>
  <rect x="344" y="228" width="248" height="44" rx="9" fill="#ffffff" stroke="#b3c6e6"/>
  <text x="362" y="256" class="boxText">WS: connect · auth · role · scope</text>
  <rect x="344" y="284" width="248" height="44" rx="9" fill="#ffffff" stroke="#b3c6e6"/>
  <text x="362" y="312" class="boxText">RPC: chat.send / agent</text>
  <rect x="344" y="340" width="248" height="44" rx="9" fill="#ffffff" stroke="#b3c6e6"/>
  <text x="362" y="368" class="boxText">Ingress: channel / internal dispatch</text>
  <rect x="344" y="396" width="248" height="44" rx="9" fill="#ffffff" stroke="#b3c6e6"/>
  <text x="362" y="424" class="boxText">session route · lanes · dedupe · abort</text>
  <text x="344" y="461" class="small">RPC admission and runtime state</text>

  <!-- context -->
  <rect x="674" y="142" width="300" height="338" rx="18" fill="#f2f8f3" stroke="#8ab69b" class="panel"/>
  <text x="700" y="178" class="section">PROMPT ASSEMBLY</text>
  <text x="700" y="207" class="boxTitle">What the model is allowed to see</text>
  <rect x="700" y="228" width="248" height="44" rx="9" fill="#ffffff" stroke="#b1d1bc"/>
  <text x="718" y="256" class="boxText">workspace · sandbox</text>
  <rect x="700" y="284" width="248" height="44" rx="9" fill="#ffffff" stroke="#b1d1bc"/>
  <text x="718" y="312" class="boxText">bootstrap files · skills</text>
  <rect x="700" y="340" width="248" height="44" rx="9" fill="#ffffff" stroke="#b1d1bc"/>
  <text x="718" y="368" class="boxText">history · compaction · memory</text>
  <rect x="700" y="396" width="248" height="44" rx="9" fill="#ffffff" stroke="#b1d1bc"/>
  <text x="718" y="424" class="boxText">tools · policy · model/auth</text>
  <text x="700" y="461" class="small">filter · sort · budget · transform</text>

  <!-- Pi runtime -->
  <rect x="1030" y="142" width="370" height="338" rx="18" fill="#fff5ec" stroke="#d4a270" class="panel"/>
  <text x="1056" y="178" class="section">PI EMBEDDED RUNTIME</text>
  <text x="1056" y="207" class="boxTitle">Product shell → engine → adapter</text>
  <rect x="1056" y="228" width="318" height="54" rx="10" fill="#ffffff" stroke="#e3b98f"/>
  <text x="1076" y="251" class="boxTitle">pi-coding-agent</text>
  <text x="1076" y="270" class="boxText">AgentSession · transcript · compaction</text>
  <rect x="1056" y="296" width="318" height="54" rx="10" fill="#fffaf4" stroke="#e3b98f"/>
  <text x="1076" y="319" class="boxTitle">pi-agent-core</text>
  <text x="1076" y="338" class="boxText">Agent Loop · tool execution · events</text>
  <rect x="1056" y="364" width="150" height="54" rx="10" fill="#ffffff" stroke="#e3b98f"/>
  <text x="1076" y="387" class="boxTitle">pi-ai</text>
  <text x="1076" y="406" class="boxText">API adapter</text>
  <rect x="1224" y="364" width="150" height="54" rx="10" fill="#ffffff" stroke="#e3b98f"/>
  <text x="1244" y="387" class="boxTitle">Tools</text>
  <text x="1244" y="406" class="boxText">Pi + OpenClaw</text>
  <text x="1056" y="461" class="small">activeSession.prompt() is the boundary</text>

  <!-- arrows across top -->
  <path d="M260 213 C286 213 292 362 318 362" class="flow"/>
  <path d="M260 305 C282 305 292 250 318 250" class="flow"/>
  <path d="M260 397 C286 397 292 362 318 362" class="flow"/>
  <path d="M618 311 C642 311 650 311 674 311" class="flow"/>
  <path d="M974 311 C998 311 1006 311 1030 311" class="flow"/>

  <!-- internal Pi arrows -->
  <path d="M1215 282 L1215 296" class="softFlow"/>
  <path d="M1215 350 L1132 364" class="softFlow"/>
  <path d="M1215 350 L1298 364" class="softFlow"/>

  <!-- loop / events band -->
  <rect x="70" y="548" width="1330" height="226" rx="18" fill="#fbfcfe" stroke="#cbd7e2" class="panel"/>
  <text x="98" y="584" class="section">RUNTIME LOOP AND RETURN PATH</text>
  <rect x="98" y="618" width="226" height="76" rx="12" fill="#e9eefb" stroke="#9aaee4"/>
  <text x="120" y="650" class="boxTitle">Model response</text>
  <text x="120" y="674" class="boxText">assistant text or toolCall</text>
  <rect x="388" y="618" width="226" height="76" rx="12" fill="#f5efe4" stroke="#d9bd89"/>
  <text x="410" y="650" class="boxTitle">Tool execution</text>
  <text x="410" y="674" class="boxText">validate → execute → result</text>
  <rect x="678" y="618" width="226" height="76" rx="12" fill="#e8f3f7" stroke="#8bc3d0"/>
  <text x="700" y="650" class="boxTitle">ToolResultMessage</text>
  <text x="700" y="674" class="boxText">observe and continue</text>
  <rect x="968" y="618" width="226" height="76" rx="12" fill="#f2f8f3" stroke="#8ab69b"/>
  <text x="990" y="650" class="boxTitle">Pi events</text>
  <text x="990" y="674" class="boxText">assistant · tool · lifecycle</text>
  <rect x="1258" y="618" width="112" height="76" rx="12" fill="#eef5ff" stroke="#7698cf"/>
  <text x="1272" y="650" class="boxTitle">Gateway</text>
  <text x="1272" y="674" class="boxText">→ surface</text>
  <path d="M324 656 L388 656" class="flow"/>
  <path d="M614 656 L678 656" class="flow"/>
  <path d="M904 656 L968 656" class="flow"/>
  <path d="M1194 656 L1258 656" class="flow"/>
  <path d="M790 618 C790 584 790 584 790 516 C790 500 790 492 790 480" class="softFlow"/>
  <text x="98" y="735" class="small">The loop stays inside Pi; OpenClaw translates and delivers the observable events.</text>
</svg>
