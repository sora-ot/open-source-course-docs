<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Pi three-layer architecture and agent loop</title>
  <desc id="desc">The pi-ai adapter sits below pi-agent-core and pi-coding-agent, with a loop from model response to tool execution and tool result.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#132238" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#36536f"/>
    </marker>
    <style>
      .title { font: 700 29px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #132238; }
      .subtitle { font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #60758a; }
      .head { font: 700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #132238; }
      .text { font: 400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #496175; }
      .label { font: 700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing: 1px; fill: #36536f; }
      .flow { fill: none; stroke: #36536f; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="760" fill="#f7fafc"/>
  <rect x="28" y="24" width="1224" height="712" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="68" y="76" class="title">Pi: protocol layer, engine, product shell</text>
  <text x="68" y="104" class="subtitle">The loop is generic; the coding-agent layer turns it into a persistent product.</text>

  <text x="70" y="157" class="label">THREE LAYERS</text>
  <rect x="70" y="181" width="470" height="112" rx="16" fill="#fff5ec" stroke="#d4a270"/>
  <text x="98" y="220" class="head">pi-coding-agent</text>
  <text x="98" y="246" class="text">SessionManager · AgentSession · coding tools</text>
  <text x="98" y="268" class="text">resources · extensions · CLI · compaction/retry</text>
  <rect x="70" y="315" width="470" height="112" rx="16" fill="#eef5ff" stroke="#7698cf"/>
  <text x="98" y="354" class="head">pi-agent-core</text>
  <text x="98" y="380" class="text">Agent state · runLoop · tool execution</text>
  <text x="98" y="402" class="text">lifecycle events · steering/follow-up queues</text>
  <rect x="70" y="449" width="470" height="112" rx="16" fill="#f2f8f3" stroke="#8ab69b"/>
  <text x="98" y="488" class="head">pi-ai</text>
  <text x="98" y="514" class="text">Message · Context · Tool schema</text>
  <text x="98" y="536" class="text">API registry · provider stream adapters</text>
  <path d="M305 293 L305 315" class="flow"/>
  <path d="M305 427 L305 449" class="flow"/>
  <text x="70" y="605" class="text">pi-tui is an adjacent UI layer: it observes events and renders them.</text>

  <text x="650" y="157" class="label">ONE TURN INSIDE THE ENGINE</text>
  <rect x="650" y="181" width="520" height="380" rx="18" fill="#fbfcfe" stroke="#cbd7e2"/>
  <rect x="688" y="220" width="194" height="72" rx="12" fill="#e9eefb" stroke="#9aaee4"/>
  <text x="710" y="251" class="head">LLM response</text>
  <text x="710" y="274" class="text">assistant + toolCall?</text>
  <rect x="938" y="220" width="194" height="72" rx="12" fill="#f5efe4" stroke="#d9bd89"/>
  <text x="960" y="251" class="head">Tool execution</text>
  <text x="960" y="274" class="text">validate + execute</text>
  <rect x="938" y="376" width="194" height="72" rx="12" fill="#e8f3f7" stroke="#8bc3d0"/>
  <text x="960" y="407" class="head">Tool result</text>
  <text x="960" y="430" class="text">ToolResultMessage</text>
  <rect x="688" y="376" width="194" height="72" rx="12" fill="#f2f8f3" stroke="#8ab69b"/>
  <text x="710" y="407" class="head">Next Context</text>
  <text x="710" y="430" class="text">append and continue</text>
  <path d="M882 256 L938 256" class="flow"/>
  <path d="M1035 292 L1035 376" class="flow"/>
  <path d="M938 412 L882 412" class="flow"/>
  <path d="M785 376 C730 350 730 315 785 292" class="flow"/>
  <text x="700" y="507" class="text">No tool call? The loop can finish or consume queued steering/follow-up.</text>
  <text x="70" y="687" class="label">BOUNDARY</text>
  <text x="160" y="687" class="text">OpenClaw prepares the session and calls activeSession.prompt(); Pi runs this loop.</text>
</svg>
