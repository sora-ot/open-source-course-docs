<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>房源搜索 · 地区、页面与房源循环教学页</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243b;font-family:"Microsoft YaHei","Segoe UI",sans-serif;font-size:17px}main{max-width:1060px;margin:0 auto;padding:28px 28px 22px}.eyebrow{color:#4864a0;font-size:13px;letter-spacing:2px;font-weight:700}h1{font-size:30px;line-height:1.35;margin:7px 0 8px}header p{color:#64748b;margin:0 0 19px;font-size:16px}.steps{display:flex;gap:12px;margin-bottom:20px}.step{background:#e9effa;border:1px solid #d9e3f5;padding:10px 15px;border-radius:10px;flex:1;color:#3c5074;font-size:15px}.step b{color:#244c9a}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px}.panel{background:white;border:1px solid #e0e6ef;border-radius:16px;padding:22px;box-shadow:0 5px 20px #22375305}label{display:block;font-size:15px;color:#55657d;margin-bottom:8px}.search{display:flex;gap:10px}input{font:inherit;min-width:0;flex:1;border:1px solid #c4d0e1;border-radius:9px;padding:11px 13px;color:#192f50;outline-color:#3669d8}button{font:inherit;border:0;cursor:pointer;border-radius:9px;padding:10px 21px;background:#3264d1;color:white;font-weight:600}.chips{display:flex;align-items:center;gap:8px;margin:12px 0 20px;font-size:13px;color:#7b879a}.chips button{font-size:13px;font-weight:400;background:#f0f3f8;color:#5b6f8a;padding:5px 13px}.chips button.active{background:#e8efff;color:#2859bd}.list-heading{display:flex;align-items:center;justify-content:space-between;padding-top:17px;border-top:1px solid #e8edf4}h2{margin:0;font-size:20px}.count{font-size:13px;color:#8391a5}ul{list-style:none;padding:0;margin:15px 0 0}#products li{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;border:1px solid #e1e7f0;border-radius:11px;padding:20px 16px;margin-top:12px;min-height:79px}.product-name{font-weight:600;font-size:21px}.stock{font-size:15px;font-weight:600;border-radius:7px;padding:6px 12px}.available{color:#087f58;background:#e5f6ee}.unavailable{color:#8b5d32;background:#fbf1e4}aside .label{font-size:13px;color:#7c8da8}aside h2{margin:9px 0 15px;font-size:22px}.round{display:inline-block;background:#e9efff;color:#355bb1;padding:5px 10px;border-radius:6px;font-size:13px}.explain{font-size:15px;line-height:1.9;color:#64748b;margin:15px 0 21px}.outcome{border-top:1px solid #e6ebf3;padding-top:17px}.outcome strong{font-size:16px}.outcome p{font-size:15px;color:#2b785d;line-height:1.8;margin:10px 0 0}.hint{color:#6b7b94;font-size:14px;line-height:1.75;padding:17px 3px 0}footer{margin-top:17px;color:#98a4b7;font-size:12px;display:flex;justify-content:space-between}.empty{font-size:16px;color:#74829a;padding:20px 0}

.layout{grid-template-columns:minmax(0,1fr) 310px}.steps{gap:9px}.step{padding:10px 11px;font-size:14px}.house{display:flex;align-items:center;gap:15px;padding:18px 15px;border:1px solid #dfe6f1;border-radius:11px;text-decoration:none;color:#17243b;margin-top:12px;min-height:84px}.house:hover{border-color:#3264d1}.house-id{background:#edf2fc;color:#3d61a7;padding:8px 12px;border-radius:9px;font-size:21px;font-weight:700}.house-label{flex:1;font-weight:600;font-size:20px}.house-price{color:#c67b21;font-size:20px;font-weight:700}.house-price small{font-size:12px;font-weight:400;color:#8a98ac}.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:18px;font-size:14px;color:#7d8da6}a#next{border-radius:8px;background:#3264d1;padding:8px 18px;color:white;text-decoration:none}a#next.disabled{background:#e8ecf2;color:#96a3b6;pointer-events:none}.catalog{width:100%;border-collapse:collapse;font-size:13px;color:#566b88;margin:12px 0 19px}.catalog td{padding:9px 2px;border-bottom:1px solid #edf0f5}.catalog td:last-child{text-align:right}.catalog .selected{color:#1c795b;font-weight:600}.summary{font-size:14px;line-height:1.9;color:#667a96}header p{margin-bottom:18px}footer{margin-top:14px}
</style></head><body><main>
<header><div class="eyebrow">EASYSPIDER · 房源采集教学示例</div><h1>房源搜索</h1><p>搜索地区，逐页查看房源，只采集“单间”的详情。</p></header>
<div class="steps"><div class="step"><b>① 地区循环</b>　海淀、朝阳</div><div class="step"><b>② 页面循环</b>　每地区两轮</div><div class="step"><b>③ 房源循环</b>　逐条检查</div><div class="step"><b>④ 判断</b>　只采单间</div></div>
<div class="layout"><section class="panel"><label for="area">输入要查询的地区</label><form class="search" id="search-form"><input id="area" value="海淀" aria-label="地区"><button id="search" type="submit">搜索</button></form><div class="chips">示例地区 <button type="button" data-area="海淀">海淀</button><button type="button" data-area="朝阳">朝阳</button></div><div class="list-heading"><h2 id="current-title"></h2><span id="count" class="count"></span></div><ul id="houses"></ul><div class="pagination"><span id="page-state"></span><a id="next" href="#">下一页 →</a></div></section>
<aside class="panel"><div class="label">讲义中的全部示例数据</div><h2 style="font-size:20px">两个地区 · 五条房源</h2><table class="catalog"><tbody id="catalog"></tbody></table><div class="outcome"><strong>预期采集：A、C、E</strong><p>单间：进入详情并采集<br>整租：走空分支，继续下一条</p></div></aside></div>
<div class="hint">当前画面是海淀第1页：先处理房源A，再处理房源B；本页处理完后，点击“下一页”查看房源C。</div><footer><span>第16篇配套截图 · 数据来自房源教学模型</span><span>地区 → 页面 → 房源 → 判断</span></footer></main>
<script>
const data={"海淀": [[{"key": "A", "text": "海淀 单间 2500元"}, {"key": "B", "text": "海淀 整租 6500元"}], [{"key": "C", "text": "海淀 单间 2800元"}]], "朝阳": [[{"key": "D", "text": "朝阳 整租 7000元"}], [{"key": "E", "text": "朝阳 单间 3000元"}]]};let currentArea='海淀',currentPage=0;
function render(area,page){currentArea=area;currentPage=page;document.getElementById('area').value=area;const pages=data[area]||[];const houses=pages[page]||[];document.getElementById('current-title').textContent=area+'房源';document.getElementById('count').textContent='当前列表 · '+houses.length+' 条';document.getElementById('page-state').textContent='第 '+(page+1)+' / '+pages.length+' 页';const list=document.getElementById('houses');list.replaceChildren();for(const house of houses){const parts=house.text.split(' ');const li=document.createElement('li');const a=document.createElement('a');a.className='house';a.href='../示例-Selenium/detail.html?id='+house.key;const id=document.createElement('span');id.className='house-id';id.textContent=house.key;const name=document.createElement('span');name.className='house-label';name.textContent=parts[0]+' · '+parts[1];const price=document.createElement('span');price.className='house-price';price.textContent=parts[2].replace('元','')+'元';const unit=document.createElement('small');unit.textContent=' / 月';price.append(unit);a.append(id,name,price);li.append(a);list.append(li);}document.getElementById('next').classList.toggle('disabled',page+1>=pages.length);document.querySelectorAll('[data-area]').forEach(button=>button.classList.toggle('active',button.dataset.area===area));document.querySelector('.hint').textContent='当前画面是'+area+'第'+(page+1)+'页：逐条处理当前列表，单间采集、整租跳过；本页处理完成后，再继续页面与地区循环。';}
for(const [area,pages] of Object.entries(data)){pages.forEach((houses,page)=>{for(const house of houses){const tr=document.createElement('tr');if(house.text.includes('单间'))tr.className='selected';const region=document.createElement('td');region.textContent=area+' · 第'+(page+1)+'页';const item=document.createElement('td');item.textContent=house.key+' '+house.text.split(' ').slice(1).join(' ');tr.append(region,item);document.getElementById('catalog').append(tr);}});}
document.getElementById('search-form').addEventListener('submit',event=>{event.preventDefault();render(document.getElementById('area').value.trim(),0)});document.getElementById('next').addEventListener('click',event=>{event.preventDefault();if(currentPage+1<(data[currentArea]||[]).length)render(currentArea,currentPage+1)});document.querySelectorAll('[data-area]').forEach(button=>button.addEventListener('click',()=>render(button.dataset.area,0)));render('海淀',0);
</script></body></html>
