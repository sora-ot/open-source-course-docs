<text x="24" y="533" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="17" font-weight="400" fill="#3e566c" text-anchor="start" dominant-baseline="central">全局先启动陈1；小林才放行林2，排在李1后面。等待队列仍有2个人。</text>
