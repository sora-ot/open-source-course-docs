<text x="40" y="121.5" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#243b53" text-anchor="start" dominant-baseline="central">个人等待队列</text>
<text x="40" y="148" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#617789" text-anchor="start" dominant-baseline="central">每段会话：前一条结束，才放行下一条</text>
<text x="610" y="121.5" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#935a10" text-anchor="middle" dominant-baseline="central">全局等待队列（2人）</text>
<text x="610" y="148" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#617789" text-anchor="middle" dominant-baseline="central">从上往下排，队首先获得空位</text>
<text x="988" y="121.5" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#24573d" text-anchor="middle" dominant-baseline="central">真正执行中的任务</text>
<text x="988" y="148" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#617789" text-anchor="middle" dominant-baseline="central">全局上限 = 2，所以只有两个位置</text>
<text x="40" y="185" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#243b53" text-anchor="start" dominant-baseline="central">小林</text>
