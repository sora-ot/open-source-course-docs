<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title"><title id="title">入口与控制面：谁把请求交进来</title><rect width="1200" height="340" fill="white"/>
<path d="M 365 90 L 425 90" stroke="#24759b" stroke-width="2" fill="none"/><polygon points="425,90 413,95 413,85" fill="#24759b"/>
<path d="M 765 90 L 825 90" stroke="#24759b" stroke-width="2" fill="none"/><polygon points="825,90 813,95 813,85" fill="#24759b"/>
<path d="M 1000 220 L 1000 145" stroke="#24759b" stroke-width="2" fill="none"/><polygon points="1000,145 1005,157 995,157" fill="#24759b"/>
<rect x="25" y="35" width="340" height="110" fill="#f4f8fc" stroke="#24759b" stroke-width="2"/>
<text x="195" y="59" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="21" font-weight="700" fill="#263b50">01 消息渠道与客户端</text>
<text x="195" y="90" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="17" font-weight="400" fill="#263b50">Telegram / WhatsApp / WebChat / CLI</text>
<text x="195" y="121" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="17" font-weight="400" fill="#263b50">用户发送消息或提交请求</text>
<rect x="425" y="35" width="340" height="110" fill="#f4f8fc" stroke="#24759b" stroke-width="2"/>
<text x="595" y="59" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="21" font-weight="700" fill="#263b50">02 Channel ingress</text>
<text x="595" y="90" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="17" font-weight="400" fill="#263b50">平台消息 → 统一入口上下文</text>
<text x="595" y="121" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="17" font-weight="400" fill="#263b50">保留发送者、会话与回复位置</text>
<rect x="825" y="35" width="350" height="110" fill="#f4f8fc" stroke="#24759b" stroke-width="2"/>
<text x="1000" y="59" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="21" font-weight="700" fill="#263b50">04 Gateway control plane</text>
<text x="1000" y="90" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="17" font-weight="400" fill="#263b50">连接、认证、RPC、事件</text>
<text x="1000" y="121" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="17" font-weight="400" fill="#263b50">协调系统运行与状态</text>
<rect x="825" y="220" width="350" height="95" fill="#f4f8fc" stroke="#24759b" stroke-width="2"/>
<text x="1000" y="236.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="21" font-weight="700" fill="#263b50">03 内部触发入口</text>
<text x="1000" y="267.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="17" font-weight="400" fill="#263b50">cron / heartbeat / webhook</text>
<text x="1000" y="298.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="17" font-weight="400" fill="#263b50">按各自模式发起任务或系统事件</text>
</svg>
