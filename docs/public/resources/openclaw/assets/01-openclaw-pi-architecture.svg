<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1220" viewBox="0 0 1680 1220" role="img" aria-labelledby="title desc">
<title id="title">OpenClaw 与 Pi 整体架构</title>
<desc id="desc">消息渠道与客户端进入 OpenClaw 的接入和运行管理。OpenClaw 准备环境，内嵌 Pi 的 AgentSession、Agent Loop 与 pi-ai 组织模型和工具调用。事件与回复返回原入口。工作文件、Memory 和会话记录分别参与读取、检索和持久化。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#526b89"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#8c789d"/></marker>
  <style>
  text {font-family: 'PingFang SC','Heiti SC',Arial,sans-serif; fill:#24354a;}
  .h {font-size:26px;font-weight:600;}
  .p {font-size:22px;}
  .s {font-size:18px;fill:#5a6d82;}
  .line {fill:none;stroke:#526b89;stroke-width:2.4;stroke-linejoin:round;marker-end:url(#a);}
  .data {fill:none;stroke:#8c789d;stroke-width:2.1;stroke-dasharray:7 5;stroke-linejoin:round;marker-end:url(#b);}
  </style>
</defs>
