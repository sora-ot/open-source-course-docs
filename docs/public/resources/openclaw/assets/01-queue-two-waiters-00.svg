<text x="24" y="482" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#617789" text-anchor="start" dominant-baseline="central">已完成</text>
<text x="132" y="482" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#8a98a5" text-anchor="start" dominant-baseline="central">暂无</text>
<text x="24" y="533" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="17" font-weight="400" fill="#3e566c" text-anchor="start" dominant-baseline="central">每个人都有后续任务；全局只有两个运行位置，开始调度后就会有两人在全局等候。</text>
