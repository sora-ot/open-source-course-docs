<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title">
<title id="title">最终状态：其余任务按同样规则完成，十条任务全部结束</title><rect width="1200" height="570" fill="white"/>
<text x="24" y="33" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="26" font-weight="700" fill="#243b53" text-anchor="start" dominant-baseline="central">最终状态：其余任务按同样规则完成，十条任务全部结束</text>
<text x="24" y="71" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#526779" text-anchor="start" dominant-baseline="central">小林 2 条、小王 3 条、小陈 3 条、小李 2 条；每会话一次 1 条；全局同时最多 2 条。</text>
<rect x="24" y="100" width="400" height="344" fill="#fafcfe" stroke="#b7c9d9" stroke-width="1.5"/>
<rect x="476" y="100" width="268" height="344" fill="#fff8ed" stroke="#c79545" stroke-width="1.5"/>
<rect x="800" y="100" width="376" height="344" fill="#f8fcfa" stroke="#9dbca9" stroke-width="1.5"/>
<text x="40" y="121.5" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#243b53" text-anchor="start" dominant-baseline="central">个人等待队列</text>
<text x="40" y="148" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#617789" text-anchor="start" dominant-baseline="central">每段会话：前一条结束，才放行下一条</text>
<text x="610" y="121.5" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#935a10" text-anchor="middle" dominant-baseline="central">全局等待队列（0人）</text>
<text x="610" y="148" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#617789" text-anchor="middle" dominant-baseline="central">从上往下排，队首先获得空位</text>
<text x="988" y="121.5" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#24573d" text-anchor="middle" dominant-baseline="central">真正执行中的任务</text>
<text x="988" y="148" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="15" font-weight="400" fill="#617789" text-anchor="middle" dominant-baseline="central">全局上限 = 2，所以只有两个位置</text>
<text x="40" y="185" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#243b53" text-anchor="start" dominant-baseline="central">小林</text>
<text x="126" y="185" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#8a98a5" text-anchor="start" dominant-baseline="central">空</text>
<text x="40" y="214" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="14" font-weight="400" fill="#617789" text-anchor="start" dominant-baseline="central">本人的任务已完成</text>
<text x="40" y="251" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#243b53" text-anchor="start" dominant-baseline="central">小王</text>
<text x="126" y="251" font-family="Microsoft YaHei UI, Noto Sans SC, sans-serif" font-size="18" font-weight="400" fill="#8a98a5" text-anchor="start" dominant-baseline="central">空</text>
